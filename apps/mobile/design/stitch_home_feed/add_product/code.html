<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BarterDash Live - Add/Edit Product</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#007bff",
                        "background-light": "#f5f7f8",
                        "background-dark": "#0f1923",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Space Grotesk', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen">
<div class="max-w-md mx-auto bg-white dark:bg-slate-900 min-h-screen flex flex-col shadow-xl">
<!-- Header Navigation -->
<header class="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
<div class="flex items-center justify-between p-4">
<button class="flex items-center justify-center size-10 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-slate-600 dark:text-slate-300">arrow_back</span>
</button>
<h1 class="text-lg font-bold tracking-tight">List New Item</h1>
<div class="size-10"></div> <!-- Spacer for symmetry -->
</div>
</header>
<main class="flex-1 overflow-y-auto pb-32">
<!-- Photo Upload Section -->
<section class="p-4">
<div class="flex items-baseline justify-between mb-3">
<h2 class="text-base font-bold">Add up to 5 photos</h2>
<span class="text-xs text-slate-500 font-medium">1 / 5</span>
</div>
<p class="text-sm text-slate-500 mb-4">The first image is your item's cover photo.</p>
<div class="grid grid-cols-3 gap-3">
<!-- Main Preview -->
<div class="relative aspect-square rounded-lg overflow-hidden border-2 border-primary bg-slate-100 dark:bg-slate-800 group">
<img class="w-full h-full object-cover" data-alt="Vintage camera on a wooden table" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD-2DGq6RXM9CznPhGNlcMDmxppNNCGqntk98hgUP9GXJUxzkGAkS7Tz2YgElYH05h6j4R_d0RzK-euMt9GUe8vuUtn2XRCgpLWQcmaBkEFpWp0aRHQ2pSUHnui6vWjtVG56mhjtDUULnWQJIFXkIiJNypGQVGPFlUv-Iv27QGdLWVzJebJQTks9_TQdMN9pnTcz7B5zkOANZCddkjZGWcP-FCyViXY35rgfhELFlkSoEoXJOtIgLXzqgnG7TcNIqeqFMxDiVZ1v60f"/>
<button class="absolute top-1 right-1 size-6 bg-red-500 text-white rounded-full flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
<div class="absolute bottom-0 inset-x-0 bg-primary/90 text-white text-[10px] py-1 text-center font-bold">COVER PHOTO</div>
</div>
<!-- Placeholder/Upload Buttons -->
<button class="aspect-square rounded-lg border-2 border-dashed border-slate-300 dark:border-slate-700 flex flex-col items-center justify-center gap-1 hover:border-primary hover:bg-primary/5 transition-all text-slate-400 hover:text-primary">
<span class="material-symbols-outlined text-3xl">add_a_photo</span>
</button>
<button class="aspect-square rounded-lg border-2 border-dashed border-slate-300 dark:border-slate-700 flex flex-col items-center justify-center gap-1 hover:border-primary hover:bg-primary/5 transition-all text-slate-400 hover:text-primary">
<span class="material-symbols-outlined text-3xl">add_a_photo</span>
</button>
</div>
</section>
<div class="h-2 bg-slate-50 dark:bg-slate-800/50"></div>
<!-- Form Fields -->
<div class="p-4 space-y-6">
<!-- Title Field -->
<div>
<label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">What are you bartering?</label>
<input class="w-full h-14 px-4 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-slate-400" placeholder="e.g. Vintage Nikon F3 Camera" type="text" value="Vintage Nikon F3 Camera"/>
</div>
<!-- Category Field -->
<div>
<label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Category</label>
<div class="relative">
<select class="appearance-none w-full h-14 px-4 pr-10 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all cursor-pointer">
<option value="">Select a Category</option>
<option selected="" value="electronics">Electronics</option>
<option value="fashion">Fashion</option>
<option value="collectibles">Collectibles</option>
<option value="home">Home &amp; Garden</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">expand_more</span>
</div>
</div>
<!-- Starting Bid -->
<div>
<label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Starting Bid (Equivalent Value)</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 font-bold">$</span>
<input class="w-full h-14 pl-8 pr-4 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-slate-400" inputmode="numeric" placeholder="0.00" type="number" value="150.00"/>
</div>
<p class="mt-2 text-xs text-slate-500 italic">This helps traders understand your item's value baseline.</p>
</div>
<!-- Description -->
<div>
<label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Description</label>
<textarea class="w-full min-h-[160px] p-4 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-slate-400 resize-none" placeholder="Tell us more about the condition, history, and why you're bartering it...">Excellent condition vintage Nikon F3 from 1982. Recently serviced, no light leaks. Comes with original leather strap and 50mm f/1.8 lens. Looking for a modern mirrorless or high-end mechanical keyboard.</textarea>
</div>
</div>
</main>
<!-- Fixed Footer Action -->
<footer class="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-4 bg-white/90 dark:bg-slate-900/90 backdrop-blur-lg border-t border-slate-100 dark:border-slate-800">
<div class="flex gap-3">
<button class="flex-1 h-14 rounded-lg font-bold text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                    Save Draft
                </button>
<button class="flex-[2] h-14 rounded-lg bg-primary text-white font-bold shadow-lg shadow-primary/30 hover:bg-primary/90 transition-all active:scale-[0.98]">
                    Post Item Live
                </button>
</div>
</footer>
</div>
</body></html>
