<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Edit Profile - BarterDash Live</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#007bff",
                "background-light": "#f5f7f8",
                "background-dark": "#0f1923",
              },
              fontFamily: {
                "display": ["Space Grotesk", "sans-serif"]
              },
              borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
            },
          },
        }
    </script>
<style>
        body {
            font-family: 'Space Grotesk', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen">
<div class="max-w-md mx-auto bg-white dark:bg-slate-900 min-h-screen shadow-sm flex flex-col">
<!-- Top Navigation -->
<header class="flex items-center justify-between p-4 border-b border-slate-100 dark:border-slate-800 sticky top-0 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md z-10">
<button class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors">
<span class="material-symbols-outlined block">arrow_back</span>
</button>
<h1 class="text-lg font-bold tracking-tight">Edit Profile</h1>
<div class="w-10"></div> <!-- Spacer for centering title -->
</header>
<main class="flex-1 overflow-y-auto">
<!-- Profile Picture Section -->
<div class="flex flex-col items-center py-8 px-4">
<div class="relative group cursor-pointer">
<div class="w-32 h-32 rounded-full border-4 border-white dark:border-slate-800 shadow-lg overflow-hidden bg-slate-200" data-alt="User profile avatar showing a friendly man" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAOkwSPA3l36wFTvLxURse73WvyR5aL1HdRcfroDFl-YnWOxE9eQPEWdu2oQZdHkblGbX8zj7WkuDrxOholHTnPSCqrAWOvkAHmj8rnGm77AotE0iuyY7xuTm4Lbm15SuWpXN_Fz2PKBnoo8ZhyOfUrcuwpgA8oZJQq2IKJRWapX3dJxwR84fHrCc1x5Y5g44YkQ7Mzs8YN2Neqsa9_Hr9It_Xu1vfH3b9rlkqcLm7uZ3jj84_Ho0YqKiL9OLOIOAkQuDo6SRC56XKu')">
</div>
<div class="absolute bottom-0 right-0 bg-primary text-white p-2 rounded-full shadow-md border-2 border-white dark:border-slate-900">
<span class="material-symbols-outlined text-sm block">photo_camera</span>
</div>
</div>
<button class="mt-4 text-primary font-semibold text-sm hover:underline">
                    Change Profile Picture
                </button>
</div>
<!-- Account Details Section -->
<div class="px-6 space-y-6">
<div>
<h2 class="text-sm font-bold uppercase tracking-wider text-slate-400 mb-4">Account Details</h2>
<div class="space-y-4">
<label class="block">
<span class="text-sm font-medium text-slate-700 dark:text-slate-300 block mb-1">Display Name</span>
<input class="w-full px-4 py-3 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" placeholder="Alex Rivers" type="text" value="Alex Rivers"/>
</label>
<label class="block">
<div class="flex justify-between mb-1">
<span class="text-sm font-medium text-slate-700 dark:text-slate-300">Bio</span>
<span class="text-xs text-slate-400">112/150</span>
</div>
<textarea class="w-full px-4 py-3 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all min-h-[100px] resize-none" placeholder="Tell the community about what you offer and what you're looking for...">Digital designer by day, vintage watch collector by night. Always looking for rare horology finds and retro tech.</textarea>
</label>
</div>
</div>
<!-- Social Links Section -->
<div>
<h2 class="text-sm font-bold uppercase tracking-wider text-slate-400 mb-4">Social Connectivity</h2>
<div class="space-y-3">
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
<span class="material-symbols-outlined text-lg">alternate_email</span>
</div>
<input class="w-full pl-10 pr-4 py-3 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" placeholder="Twitter Handle" type="text" value="@arivers_design"/>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
<span class="material-symbols-outlined text-lg">photo_camera</span>
</div>
<input class="w-full pl-10 pr-4 py-3 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" placeholder="Instagram Handle" type="text" value="arivers_trades"/>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
<span class="material-symbols-outlined text-lg">link</span>
</div>
<input class="w-full pl-10 pr-4 py-3 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" placeholder="Personal Website" type="text" value="https://arivers.me"/>
</div>
</div>
</div>
</div>
<div class="h-24"></div> <!-- Spacer for footer -->
</main>
<!-- Save Button Footer -->
<footer class="p-6 border-t border-slate-100 dark:border-slate-800 bg-white dark:bg-slate-900">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-lg shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-xl">check_circle</span>
                Save Changes
            </button>
</footer>
</div>
</body></html>
