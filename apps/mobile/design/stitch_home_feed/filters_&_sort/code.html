<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BarterDash Live - Filters &amp; Sort</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#007bff",
                        "background-light": "#f5f7f8",
                        "background-dark": "#0f1923",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Space Grotesk', sans-serif;
        }
        /* Custom scrollbar for better look */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100">
<div class="relative flex min-h-screen w-full flex-col overflow-hidden">
<!-- Main Content Background (Simulated behind the modal) -->
<div class="flex flex-col p-4 opacity-40 pointer-events-none">
<header class="flex items-center justify-between mb-6">
<div class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center text-white">
<span class="material-symbols-outlined">bolt</span>
</div>
<div class="flex-1 px-4">
<div class="h-4 bg-slate-300 w-32 rounded"></div>
</div>
<span class="material-symbols-outlined">search</span>
</header>
<div class="grid grid-cols-2 gap-4">
<div class="aspect-square bg-slate-200 rounded-xl"></div>
<div class="aspect-square bg-slate-200 rounded-xl"></div>
<div class="aspect-square bg-slate-200 rounded-xl"></div>
<div class="aspect-square bg-slate-200 rounded-xl"></div>
</div>
</div>
<!-- Bottom Sheet Overlay / Modal -->
<div class="fixed inset-0 z-50 flex flex-col justify-end bg-slate-900/60 backdrop-blur-sm">
<!-- Bottom Sheet Container -->
<div class="bg-white dark:bg-slate-900 w-full max-w-2xl mx-auto rounded-t-3xl shadow-2xl flex flex-col max-h-[90vh]">
<!-- BottomSheetHandle -->
<button class="flex h-6 w-full items-center justify-center shrink-0">
<div class="h-1.5 w-12 rounded-full bg-slate-200 dark:bg-slate-700"></div>
</button>
<!-- Header -->
<div class="flex items-center justify-between px-6 py-4 border-b border-slate-100 dark:border-slate-800">
<button class="flex items-center justify-center w-10 h-10 -ml-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-slate-600 dark:text-slate-400">close</span>
</button>
<h2 class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">Filters &amp; Sort</h2>
<button class="text-primary font-bold text-sm tracking-wide uppercase">Reset</button>
</div>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto px-6 py-4 space-y-8">
<!-- Sort By Section -->
<section>
<h3 class="text-lg font-bold mb-4 text-slate-900 dark:text-white">Sort By</h3>
<div class="grid gap-3">
<label class="flex items-center justify-between p-4 rounded-xl border-2 border-primary bg-primary/5 cursor-pointer">
<span class="font-medium text-slate-900 dark:text-white">Ending Soon</span>
<input checked="" class="w-5 h-5 text-primary focus:ring-primary border-slate-300" name="sort" type="radio"/>
</label>
<label class="flex items-center justify-between p-4 rounded-xl border-2 border-slate-100 dark:border-slate-800 hover:border-slate-200 dark:hover:border-slate-700 cursor-pointer">
<span class="font-medium text-slate-700 dark:text-slate-300">Price: Low to High</span>
<input class="w-5 h-5 text-primary focus:ring-primary border-slate-300" name="sort" type="radio"/>
</label>
<label class="flex items-center justify-between p-4 rounded-xl border-2 border-slate-100 dark:border-slate-800 hover:border-slate-200 dark:hover:border-slate-700 cursor-pointer">
<span class="font-medium text-slate-700 dark:text-slate-300">Newest</span>
<input class="w-5 h-5 text-primary focus:ring-primary border-slate-300" name="sort" type="radio"/>
</label>
</div>
</section>
<!-- Price Range Section -->
<section>
<div class="flex justify-between items-center mb-4">
<h3 class="text-lg font-bold text-slate-900 dark:text-white">Price Range</h3>
<span class="text-sm font-medium text-slate-500">$0 - $1,500+</span>
</div>
<div class="px-2 mb-6">
<div class="relative w-full h-2 bg-slate-200 dark:bg-slate-800 rounded-full">
<div class="absolute left-0 right-1/4 h-full bg-primary rounded-full"></div>
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-6 h-6 bg-white border-2 border-primary rounded-full shadow-md cursor-grab"></div>
<div class="absolute right-1/4 top-1/2 -translate-y-1/2 w-6 h-6 bg-white border-2 border-primary rounded-full shadow-md cursor-grab"></div>
</div>
</div>
<div class="flex gap-4">
<div class="flex-1">
<label class="text-xs font-bold text-slate-400 uppercase mb-1 block">Min Price</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">$</span>
<input class="w-full pl-8 pr-4 py-3 rounded-lg border-slate-200 dark:border-slate-800 dark:bg-slate-800 focus:border-primary focus:ring-0 text-sm font-medium" placeholder="0" type="number"/>
</div>
</div>
<div class="flex-1">
<label class="text-xs font-bold text-slate-400 uppercase mb-1 block">Max Price</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">$</span>
<input class="w-full pl-8 pr-4 py-3 rounded-lg border-slate-200 dark:border-slate-800 dark:bg-slate-800 focus:border-primary focus:ring-0 text-sm font-medium" placeholder="1500" type="number"/>
</div>
</div>
</div>
</section>
<!-- Categories Section -->
<section>
<h3 class="text-lg font-bold mb-4 text-slate-900 dark:text-white">Categories</h3>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 rounded-full border-2 border-primary bg-primary text-white text-sm font-bold">Electronics</button>
<button class="px-4 py-2 rounded-full border-2 border-slate-100 dark:border-slate-800 text-slate-600 dark:text-slate-400 text-sm font-bold hover:bg-slate-50 dark:hover:bg-slate-800">Collectibles</button>
<button class="px-4 py-2 rounded-full border-2 border-slate-100 dark:border-slate-800 text-slate-600 dark:text-slate-400 text-sm font-bold hover:bg-slate-50 dark:hover:bg-slate-800">Fashion</button>
<button class="px-4 py-2 rounded-full border-2 border-slate-100 dark:border-slate-800 text-slate-600 dark:text-slate-400 text-sm font-bold hover:bg-slate-50 dark:hover:bg-slate-800">Home</button>
<button class="px-4 py-2 rounded-full border-2 border-slate-100 dark:border-slate-800 text-slate-600 dark:text-slate-400 text-sm font-bold hover:bg-slate-50 dark:hover:bg-slate-800">Games</button>
<button class="px-4 py-2 rounded-full border-2 border-slate-100 dark:border-slate-800 text-slate-600 dark:text-slate-400 text-sm font-bold hover:bg-slate-50 dark:hover:bg-slate-800">Art</button>
</div>
</section>
<!-- Condition Section -->
<section>
<h3 class="text-lg font-bold mb-4 text-slate-900 dark:text-white">Condition</h3>
<div class="grid grid-cols-2 gap-3">
<label class="flex items-center gap-3 p-3 rounded-xl border border-slate-100 dark:border-slate-800 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800">
<input class="w-5 h-5 rounded text-primary focus:ring-primary border-slate-300" type="checkbox"/>
<span class="text-sm font-medium text-slate-700 dark:text-slate-300">New</span>
</label>
<label class="flex items-center gap-3 p-3 rounded-xl border border-slate-100 dark:border-slate-800 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800">
<input checked="" class="w-5 h-5 rounded text-primary focus:ring-primary border-slate-300" type="checkbox"/>
<span class="text-sm font-medium text-slate-700 dark:text-slate-300">Like New</span>
</label>
<label class="flex items-center gap-3 p-3 rounded-xl border border-slate-100 dark:border-slate-800 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800">
<input checked="" class="w-5 h-5 rounded text-primary focus:ring-primary border-slate-300" type="checkbox"/>
<span class="text-sm font-medium text-slate-700 dark:text-slate-300">Good</span>
</label>
<label class="flex items-center gap-3 p-3 rounded-xl border border-slate-100 dark:border-slate-800 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800">
<input class="w-5 h-5 rounded text-primary focus:ring-primary border-slate-300" type="checkbox"/>
<span class="text-sm font-medium text-slate-700 dark:text-slate-300">Fair</span>
</label>
</div>
</section>
</div>
<!-- Footer Action -->
<div class="p-6 border-t border-slate-100 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/25 transition-all active:scale-[0.98] flex items-center justify-center gap-2">
<span>Apply Filters</span>
<span class="px-2 py-0.5 bg-white/20 rounded-md text-xs">124 Results</span>
</button>
</div>
</div>
</div>
</div>
</body></html>
